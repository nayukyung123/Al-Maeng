spring:
  application:
    name: backend
  profiles:
    active: local

  # Database Configuration
  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5433}/${DB_NAME:almaeng}
    username: ${DB_USERNAME:almaeng}
    password: ${DB_PASSWORD}

  # JPA & Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  # Redis Configuration
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # Flyway Configuration
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    clean-disabled: true

# Mattermost Webhook (URL은 .env 등의 MATTERMOST_WEBHOOK_URL)
notification:
  mattermost:
    enabled: true
    webhook-url: ${MATTERMOST_WEBHOOK_URL:}
    channel:
    pretext: "@here 🚨 서버 에러 발생 🚨"
    color: "#ff5d52"
    author-name: "AL-MAENG Error Bot"
    author-icon: ""
    title: "백엔드 시스템 예외 알림"


# Auth
oauth:
  kakao:
    client-id: ${KAKAO_CLIENT_ID}
    client-secret: ${KAKAO_CLIENT_SECRET}
    redirect-uri: ${KAKAO_REDIRECT_URI}
    user-info-uri: https://kapi.kakao.com/v2/user/me
  google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    redirect-uri: ${GOOGLE_REDIRECT_URI}
    user-info-uri: https://www.googleapis.com/oauth2/v2/userinfo
  naver:
    client-id: ${NAVER_CLIENT_ID}
    client-secret: ${NAVER_CLIENT_SECRET}
    redirect-uri: ${NAVER_REDIRECT_URI}
    user-info-uri: https://openapi.naver.com/v1/nid/me


# Jwt
jwt:
  secret: ${JWT_SECRET}
  access-expiration: 3600000
  refresh-expiration: 1209600000

# S3
cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}
    region:
      static: ap-northeast-2
    s3:
      bucket: ${S3_BUCKET_NAME}