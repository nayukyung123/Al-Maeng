spring:
  application:
    name: backend

  # Database Configuration
  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5433}/${DB_NAME:almaeng}
    username: ${DB_USERNAME:almaeng}
    password: ${DB_PASSWORD}

  # JPA & Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  # Redis Configuration
  data:
    redis:
      host: localhost
      port: ${REDIS_PORT:6379}

  # Flyway Configuration
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    clean-disabled: true

# Mattermost Webhook
