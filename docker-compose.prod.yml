version: '3.8'

services:
  db:
    image: postgres:17-alpine
    container_name: almaeng-postgres-dev
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      TZ: Asia/Seoul
    volumes:
      - ./dev-db-data:/var/lib/postgresql/data
    networks:
      - almaeng-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      retries: 5

  redis:
    image: redis:alpine
    container_name: almaeng-redis-dev
    restart: always
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - ./dev-redis-data:/data
    networks:
      - almaeng-network

  backend:
    build: ./backend
    container_name: almaeng-backend-dev
    restart: always
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - SPRING_FLYWAY_ENABLED=true
      - SPRING_FLYWAY_URL=jdbc:postgresql://db:5432/${DB_NAME}
      - SPRING_FLYWAY_USER=${DB_USERNAME}
      - SPRING_FLYWAY_PASSWORD=${DB_PASSWORD}
      - SPRING_FLYWAY_LOCATIONS=classpath:db/migration
      - TZ=Asia/Seoul
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - almaeng-network

  frontend:
    build: ./frontend
    container_name: almaeng-frontend-dev
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - almaeng-network

networks:
  almaeng-network:
    driver: bridge