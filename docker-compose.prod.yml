version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16 
    container_name: almaeng-postgres-prod
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      TZ: Asia/Seoul
    volumes:
      - ./prod-db-data:/var/lib/postgresql/data
    networks:
      - almaeng-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      retries: 5

  redis:
    image: redis:alpine
    container_name: almaeng-redis-prod
    restart: always
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - ./prod-redis-data:/data
    networks:
      - almaeng-network

  backend:
    build: ./backend
    container_name: almaeng-backend-prod
    restart: always
    env_file:
      - .env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_FLYWAY_URL=jdbc:postgresql://db:5432/${DB_NAME}
      - SPRING_FLYWAY_USER=${DB_USERNAME}
      - SPRING_FLYWAY_PASSWORD=${DB_PASSWORD}
      - SPRING_FLYWAY_LOCATIONS=classpath:db/migration
      - SPRING_FLYWAY_ENABLED=true
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - TZ=Asia/Seoul
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - almaeng-network

  frontend:
    build: ./frontend
    container_name: almaeng-frontend-prod
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=/api            
      - INTERNAL_API_URL=http://backend:8080
    depends_on:
      - backend
    networks:
      - almaeng-network

  nginx:
    build:
      context: ./infra/nginx
      dockerfile: Dockerfile
    container_name: almaeng-nginx-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/www/certbot:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    networks:
      - almaeng-network

networks:
  almaeng-network:
    driver: bridge